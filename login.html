<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Trung tâm Tiếng Anh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm login-card border-0">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <img src="/public/assets/logo.png" alt="Logo" class="login-logo mb-3" onerror="this.src='https://via.placeholder.com/60x60/dc3545/ffffff?text=KMA'">
                <h4 class="fw-bold">Đăng nhập</h4>
                <p class="text-muted small">Nhập email và mật khẩu để truy cập hệ thống</p>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="admin@kma.edu.vn" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label small fw-semibold">Mật khẩu</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 small">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Ghi nhớ đăng nhập</label>
                    </div>
                    <a href="#" class="text-danger text-decoration-none">Quên mật khẩu?</a>
                </div>

                <div id="error-msg" class="alert alert-danger py-2 small" style="display: none;"></div>

                <button type="submit" class="btn btn-danger w-100 fw-semibold py-2">Đăng nhập</button>
            </form>

            <div class="text-center mt-4">
                <a href="/index.html" class="text-muted text-decoration-none small">← Quay lại trang chủ</a>
            </div>
        </div>
    </div>

    <script src="/public/js/api.js"></script>
    <script src="/public/js/auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
