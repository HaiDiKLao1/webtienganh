<link rel="stylesheet" href="/core/admin/students.css" />

<main class="container-fluid py-2 animate__animated animate__fadeIn">
  <header class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 fw-bold mb-0">Quản lý Học sinh</h1>
    <div class="d-flex gap-2">
      <button
        id="btn-bulk-delete"
        class="btn btn-outline-danger shadow-sm d-none"
        onclick="window.studentManager.deleteSelected()"
      >
        <i class="fa-solid fa-trash-can me-1"></i> Xóa (<span
          id="selected-count"
          >0</span
        >)
      </button>
      <button
        class="btn btn-danger shadow-sm"
        onclick="window.studentManager.openModal()"
      >
        <i class="fa-solid fa-user-plus me-1"></i> Thêm Học sinh
      </button>
    </div>
  </header>

  <section class="card border-0 shadow-sm mb-4" aria-label="Bộ lọc và tìm kiếm">
    <div class="card-body p-3">
      <form class="row g-3" onsubmit="event.preventDefault()">
        <div class="col-md-8">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"
              ><i class="fa-solid fa-magnifying-glass text-muted"></i
            ></span>
            <input
              type="text"
              class="form-control border-start-0 ps-0"
              placeholder="Tìm kiếm theo mã HS, tên, lớp..."
              oninput="window.studentManager.onSearchInput(this.value)"
            />
          </div>
        </div>
        <div class="col-md-4">
          <select
            class="form-select"
            id="filter-status"
            aria-label="Lọc theo trạng thái"
            onchange="window.studentManager.onStatusChange(this.value)"
          >
            <option value="">Tất cả trạng thái</option>
            <option value="active">Hoạt động</option>
            <option value="inactive">Đã khóa</option>
          </select>
        </div>
      </form>
    </div>
  </section>

  <section
    class="card border-0 shadow-sm overflow-hidden"
    aria-label="Danh sách dữ liệu học sinh"
  >
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-4" style="min-width: 130px">
                <div class="d-flex align-items-center gap-2">
                  <input
                    type="checkbox"
                    id="cb-select-all"
                    class="select-checkbox m-0"
                    onchange="
                      window.studentManager.toggleSelectAll(this.checked)
                    "
                  />
                  <span>Mã HS</span>
                </div>
              </th>
              <th>Họ và tên</th>
              <th>Số điện thoại</th>
              <th>Lớp đang học</th>
              <th>Phụ huynh</th>
              <th>Trạng thái</th>
              <th class="text-end pe-4">Thao tác</th>
            </tr>
          </thead>
          <tbody id="students-tbody"></tbody>
        </table>
      </div>
    </div>
    <div id="students-pagination"></div>
  </section>
</main>

<div class="modal fade" id="studentModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-light border-bottom-0">
        <h5 class="modal-title fw-bold">Thêm Học sinh mới</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>

      <div class="px-4 pt-3 pb-0" id="modal-stepper">
        <div class="d-flex align-items-center">
          <div class="d-flex align-items-center gap-2" id="step1-ind">
            <div class="step-circle active" id="sc1">1</div>
            <span class="step-label fw-semibold small">Thông tin học sinh</span>
          </div>
          <div class="step-line mx-3" id="step-line"></div>
          <div class="d-flex align-items-center gap-2" id="step2-ind">
            <div class="step-circle" id="sc2">2</div>
            <span class="step-label text-muted small">Phụ huynh</span>
          </div>
        </div>
      </div>

      <div class="modal-body p-4">
        <div id="panel-student">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label text-muted small fw-bold"
                >Họ và tên <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="hs_fullName"
                placeholder="Nguyễn Văn A"
              />
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-bold"
                >Ngày sinh <span class="text-danger">*</span></label
              >
              <input
                type="date"
                class="form-control"
                id="hs_dob"
                onchange="
                  window.studentManager.generatePasswordFromDob(this.value)
                "
              />
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-bold"
                >Giới tính <span class="text-danger">*</span></label
              >
              <select class="form-select" id="hs_gender">
                <option value="">-- Chọn --</option>
                <option value="male">Nam</option>
                <option value="female">Nữ</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-bold"
                >Số điện thoại<span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="hs_phone"
                placeholder="09xxxxxxxxx"
              />
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-bold"
                >Email đăng nhập <span class="text-danger">*</span></label
              >
              <input
                type="email"
                class="form-control"
                id="hs_email"
                placeholder="email@gmail.com"
              />
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-bold"
                >Mật khẩu khởi tạo <span class="text-danger">*</span></label
              >
              <input
                type="password"
                class="form-control bg-light"
                id="hs_password"
                placeholder="Tự động tạo từ ngày sinh..."
                readonly
              />
            </div>
          </div>
        </div>

        <div id="panel-parent" style="display: none">
          <div class="d-flex gap-2 mb-3">
            <button
              class="btn btn-sm btn-danger"
              id="tab-new-btn"
              onclick="window.studentManager.switchParentTab('new')"
            >
              <i class="fa-solid fa-user-plus me-1"></i> Tạo mới
            </button>
            <button
              class="btn btn-sm btn-outline-secondary"
              id="tab-search-btn"
              onclick="window.studentManager.switchParentTab('search')"
            >
              <i class="fa-solid fa-magnifying-glass me-1"></i> Tìm có sẵn
            </button>
          </div>

          <div id="pane-new">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold"
                  >Họ và tên <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control"
                  id="ph_fullName"
                  placeholder="Nguyễn Văn Bố"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold"
                  >Số điện thoại <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control"
                  id="ph_phone"
                  placeholder="09xxxxxxxxx"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold"
                  >Email đăng nhập <span class="text-danger">*</span></label
                >
                <input
                  type="email"
                  class="form-control"
                  id="ph_email"
                  placeholder="email@gmail.com"
                />
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold"
                  >Quan hệ với học sinh</label
                >
                <select class="form-select" id="ph_relationship">
                  <option value="Bố">Bố</option>
                  <option value="Mẹ">Mẹ</option>
                  <option value="Ông">Ông</option>
                  <option value="Bà">Bà</option>
                  <option value="Khác">Khác</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold"
                  >Nghề nghiệp</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="ph_occupation"
                  placeholder="Giáo viên, Kỹ sư, Kinh doanh..."
                />
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold"
                  >Địa chỉ</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="ph_address"
                  placeholder="Số nhà, đường, phường/xã, tỉnh/thành..."
                />
              </div>
              <div class="col-md-12">
                <label class="form-label text-muted small fw-bold"
                  >Mật khẩu khởi tạo <span class="text-danger">*</span></label
                >
                <input
                  type="password"
                  class="form-control"
                  id="ph_password"
                  placeholder="Mật khẩu tài khoản phụ huynh"
                />
              </div>
            </div>
          </div>
          <div id="pane-search" style="display: none">
            <input
              type="text"
              class="form-control mb-2"
              id="ph_searchInput"
              placeholder="Tìm theo tên hoặc số điện thoại..."
              oninput="window.studentManager.searchParent(this.value)"
            />
            <div id="ph_searchResults"></div>
            <div id="ph_selectedInfo"></div>

            <!-- THÊM MỚI: Khung chọn quan hệ (Chỉ hiện khi đã chọn phụ huynh) -->
            <div
              class="mt-3 animate__animated animate__fadeIn"
              id="ph_search_relationship_container"
              style="display: none"
            >
              <label class="form-label text-muted small fw-bold"
                >Quan hệ với học sinh <span class="text-danger">*</span></label
              >
              <select
                class="form-select border-success"
                id="ph_search_relationship"
              >
                <option value="Bố">Bố</option>
                <option value="Mẹ">Mẹ</option>
                <option value="Ông">Ông</option>
                <option value="Bà">Bà</option>
                <option value="Khác">Khác</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer border-top-0 px-4 pb-4">
        <button
          type="button"
          class="btn btn-light"
          id="btn-back-step"
          style="display: none"
          onclick="window.studentManager.goBack()"
        >
          <i class="fa-solid fa-arrow-left me-1"></i> Quay lại
        </button>
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">
          Hủy bỏ
        </button>
        <button
          type="button"
          class="btn btn-danger px-4"
          id="btn-next-step"
          onclick="window.studentManager.goNext()"
        >
          Tiếp theo <i class="fa-solid fa-arrow-right ms-1"></i>
        </button>
        <button
          type="button"
          class="btn btn-success px-4"
          id="btn-save-student"
          style="display: none"
          onclick="window.studentManager.saveData()"
        >
          <i class="fa-solid fa-check me-1"></i> Lưu học sinh
        </button>
      </div>
    </div>
  </div>
</div>

<script src="/core/admin/students.js"></script>
