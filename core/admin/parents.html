<link rel="stylesheet" href="/core/admin/parents.css" />

<main class="container-fluid py-2 animate__animated animate__fadeIn">
  <header class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 fw-bold mb-0">Quản lý Phụ huynh</h1>
    <div class="d-flex gap-2">
      <button
        id="btn-bulk-delete"
        class="btn btn-outline-danger shadow-sm d-none"
        onclick="window.parentManager.deleteSelected()"
      >
        <i class="fa-solid fa-trash-can me-1"></i> Xóa (<span
          id="selected-count"
          >0</span
        >)
      </button>
      <button
        class="btn btn-danger shadow-sm"
        onclick="window.parentManager.openModal()"
      >
        <i class="fa-solid fa-user-plus me-1"></i> Thêm Phụ huynh
      </button>
    </div>
  </header>

  <section class="card border-0 shadow-sm mb-4" aria-label="Bộ lọc và tìm kiếm">
    <div class="card-body p-3">
      <form class="row g-3" onsubmit="event.preventDefault()">
        <div class="col-md-8">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"
              ><i class="fa-solid fa-magnifying-glass text-muted"></i
            ></span>
            <input
              type="text"
              class="form-control border-start-0 ps-0"
              placeholder="Tìm kiếm theo mã PH, tên, email, sđt..."
              oninput="window.parentManager.onSearchInput(this.value)"
            />
          </div>
        </div>
        <div class="col-md-4">
          <select
            class="form-select"
            id="filter-status"
            onchange="window.parentManager.onStatusChange(this.value)"
          >
            <option value="">Tất cả trạng thái</option>
            <option value="active">Hoạt động</option>
            <option value="inactive">Đã khóa</option>
          </select>
        </div>
      </form>
    </div>
  </section>

  <section
    class="card border-0 shadow-sm overflow-hidden"
    aria-label="Danh sách dữ liệu phụ huynh"
  >
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-4" style="min-width: 130px">
                <div class="d-flex align-items-center gap-2">
                  <input
                    type="checkbox"
                    id="cb-select-all"
                    class="select-checkbox m-0"
                    onchange="
                      window.parentManager.toggleSelectAll(this.checked)
                    "
                  />
                  <span>Mã PH</span>
                </div>
              </th>
              <th>Họ và tên</th>
              <th>Số điện thoại</th>
              <th>Email</th>
              <th>Học sinh liên kết</th>
              <th>Trạng thái</th>
              <th class="text-end pe-4">Thao tác</th>
            </tr>
          </thead>
          <tbody id="parents-tbody"></tbody>
        </table>
      </div>
    </div>
    <div id="parents-pagination"></div>
  </section>
</main>

<div class="modal fade" id="parentModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-light border-bottom-0">
        <h5 class="modal-title fw-bold" id="parentModalTitle">
          Thêm phụ huynh mới
        </h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>

      <div class="modal-body p-4">
        <form id="parentForm" autocomplete="off">
          <input type="hidden" id="ph_id" />
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label text-muted small fw-bold"
                >Họ và tên <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="ph_fullName"
                placeholder="Nguyễn Văn A"
              />
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-bold"
                >Số điện thoại <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="ph_phone"
                placeholder="09xxxxxxxxx"
              />
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-bold"
                >Email đăng nhập <span class="text-danger">*</span></label
              >
              <input
                type="email"
                class="form-control"
                id="ph_email"
                placeholder="email@gmail.com"
              />
            </div>
            <div class="col-md-6" id="ph_password_container">
              <label
                class="form-label text-muted small fw-bold"
                id="ph_password_label"
                >Mật khẩu khởi tạo <span class="text-danger">*</span></label
              >
              <input
                type="password"
                class="form-control"
                id="ph_password"
                placeholder="Mật khẩu ban đầu"
              />
            </div>
            <div class="col-md-6">
              <label class="form-label text-muted small fw-bold"
                >Nghề nghiệp</label
              >
              <input
                type="text"
                class="form-control"
                id="ph_occupation"
                placeholder="Giáo viên, Kỹ sư, Kinh doanh..."
              />
            </div>
            <div class="col-6">
              <label class="form-label text-muted small fw-bold">Địa chỉ</label>
              <input
                type="text"
                class="form-control"
                id="ph_address"
                placeholder="Số nhà, đường, phường/xã, tỉnh/thành..."
              />
            </div>

            <div
              class="col-12 mt-4 pt-3 border-top"
              id="section_link_student_main"
            >
              <h6 class="fw-bold text-dark mb-3">
                <i class="fa-solid fa-link text-primary me-2"></i>Liên kết Học
                sinh (Bắt buộc)
              </h6>
              <div class="row g-3">
                <div class="col-md-7">
                  <input
                    type="text"
                    class="form-control mb-2"
                    id="hs_searchInput_main"
                    placeholder="Tìm theo tên hoặc mã học sinh..."
                    oninput="
                      window.parentManager.searchStudent(this.value, 'main')
                    "
                  />
                  <div
                    id="hs_searchResults_main"
                    class="search-results-container"
                  ></div>
                  <!-- Đã chuyển phần hiển thị chọn khỏi đây -->
                </div>

                <div
                  class="col-md-5"
                  id="hs_relationship_container_main"
                  style="display: none"
                >
                  <label class="form-label text-muted small fw-bold"
                    >Xác nhận Quan hệ <span class="text-danger">*</span></label
                  >
                  <select
                    class="form-select border-success mb-3"
                    id="ph_relationship_main"
                  >
                    <option value="Bố">Bố</option>
                    <option value="Mẹ">Mẹ</option>
                    <option value="Ông">Ông</option>
                    <option value="Bà">Bà</option>
                    <option value="Khác">Khác</option>
                  </select>

                  <!-- Đã chuyển phần hiển thị xuống dưới ô quan hệ -->
                  <div id="hs_selectedInfo_main"></div>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer border-top-0 px-4 pb-4">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">
          Hủy bỏ
        </button>
        <button
          type="button"
          class="btn btn-danger px-4"
          id="btn-save-parent"
          onclick="window.parentManager.saveData()"
        >
          <i class="fa-solid fa-check me-1"></i> Lưu phụ huynh
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="linkStudentModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-light border-bottom-0">
        <h5 class="modal-title fw-bold">Liên kết Học sinh</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>
      <div class="modal-body p-4">
        <input type="hidden" id="link_ph_id" />
        <div class="alert alert-info py-2 small mb-3">
          Đang thêm liên kết cho Phụ huynh: <strong id="link_ph_name"></strong>
        </div>
        <input
          type="text"
          class="form-control mb-2"
          id="hs_searchInput_quick"
          placeholder="Tìm theo tên hoặc mã học sinh..."
          oninput="window.parentManager.searchStudent(this.value, 'quick')"
        />
        <div id="hs_searchResults_quick" class="search-results-container"></div>
        <div id="hs_selectedInfo_quick"></div>

        <div
          class="mt-3 animate__animated animate__fadeIn"
          id="hs_relationship_container_quick"
          style="display: none"
        >
          <label class="form-label text-muted small fw-bold"
            >Xác nhận Quan hệ <span class="text-danger">*</span></label
          >
          <select class="form-select border-success" id="ph_relationship_quick">
            <option value="Bố">Bố</option>
            <option value="Mẹ">Mẹ</option>
            <option value="Ông">Ông</option>
            <option value="Bà">Bà</option>
            <option value="Khác">Khác</option>
          </select>
        </div>
      </div>
      <div class="modal-footer border-top-0 px-4 pb-4">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">
          Hủy bỏ
        </button>
        <button
          type="button"
          class="btn btn-primary px-4"
          id="btn-save-quick-link"
          onclick="window.parentManager.saveQuickLink()"
        >
          <i class="fa-solid fa-link me-1"></i> Lưu Liên Kết
        </button>
      </div>
    </div>
  </div>
</div>

<script src="/core/admin/parents.js"></script>
