<link rel="stylesheet" href="/core/admin/classes.css" />

<main class="container-fluid py-2 animate__animated animate__fadeIn">
  <header class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 fw-bold mb-0">Quản lý Lớp học</h1>
    <div class="d-flex gap-2">
      <button
        id="btn-bulk-delete"
        class="btn btn-outline-danger shadow-sm d-none"
        onclick="window.classManager.deleteSelected()"
      >
        <i class="fa-solid fa-trash-can me-1"></i> Xóa (<span
          id="selected-count"
          >0</span
        >)
      </button>
      <button
        class="btn btn-danger shadow-sm"
        onclick="window.classManager.openModal()"
      >
        <i class="fa-solid fa-plus me-1"></i> Thêm Lớp Mới
      </button>
    </div>
  </header>

  <section class="card border-0 shadow-sm mb-4" aria-label="Bộ lọc và tìm kiếm">
    <div class="card-body p-3">
      <form class="row g-3" onsubmit="event.preventDefault()">
        <div class="col-md-8">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"
              ><i class="fa-solid fa-magnifying-glass text-muted"></i
            ></span>
            <input
              type="text"
              id="search-class"
              class="form-control border-start-0 ps-0"
              placeholder="Tìm kiếm theo mã lớp, tên lớp..."
              oninput="window.classManager.handleSearch()"
            />
          </div>
        </div>
        <div class="col-md-4">
          <select
            id="filter-status"
            class="form-select cursor-pointer"
            aria-label="Lọc theo trạng thái"
            onchange="window.classManager.handleFilter()"
          >
            <option value="">Tất cả trạng thái</option>
            <option value="open">Đang mở (Hoạt động)</option>
            <option value="closed">Đã đóng (Khóa)</option>
            <option value="pending">Đang chờ</option>
          </select>
        </div>
      </form>
    </div>
  </section>

  <section
    class="card border-0 shadow-sm overflow-hidden"
    aria-label="Danh sách dữ liệu lớp học"
  >
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-4" scope="col" style="min-width: 140px">
                <div class="d-flex align-items-center gap-2">
                  <input
                    type="checkbox"
                    id="cb-select-all"
                    class="select-checkbox m-0"
                    onchange="window.classManager.toggleSelectAll(this.checked)"
                  />
                  <span>Mã Lớp</span>
                </div>
              </th>
              <th scope="col">Tên Lớp</th>
              <th scope="col">Khóa Học</th>
              <th scope="col">Khối & Năm Học</th>
              <th style="min-width: 130px" scope="col">Sĩ Số</th>
              <th scope="col">Học Phí</th>
              <th scope="col">Trạng Thái</th>
              <th class="text-end pe-4" scope="col">Thao Tác</th>
            </tr>
          </thead>
          <tbody id="class-table-body"></tbody>
        </table>
      </div>
      <div id="class-pagination"></div>
    </div>
  </section>
</main>

<div
  class="modal fade"
  id="classModal"
  tabindex="-1"
  aria-hidden="true"
  role="dialog"
  aria-labelledby="modal-title"
>
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <article class="modal-content border-0 shadow">
      <header class="modal-header bg-light border-bottom-0">
        <h2 class="modal-title h5 fw-bold" id="modal-title">
          Thêm Lớp Học Mới
        </h2>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Đóng"
        ></button>
      </header>

      <form id="class-form">
        <section class="modal-body p-4">
          <input type="hidden" id="class-id" />
          <div class="row g-3">
            <div class="col-md-6">
              <label
                for="class-name"
                class="form-label text-muted small fw-bold"
                >Tên lớp <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="class-name"
                placeholder="VD: Toeic 2.1"
                required
              />
            </div>

            <div class="col-md-6 position-relative">
              <label
                for="course-search-input"
                class="form-label text-muted small fw-bold"
                >Khóa học liên kết <span class="text-danger">*</span></label
              >
              <input type="hidden" id="selected-course-id" required />
              <div class="input-group">
                <input
                  type="text"
                  class="form-control border-primary border-opacity-50"
                  id="course-search-input"
                  placeholder="Gõ để tìm khóa học (Sắp khai giảng)..."
                  autocomplete="off"
                  oninput="window.classManager.searchCourses(this.value)"
                  onfocus="window.classManager.searchCourses(this.value)"
                />
                <button
                  class="btn btn-outline-secondary border-primary border-opacity-50"
                  type="button"
                  onclick="window.classManager.clearCourseSelection()"
                  title="Bỏ chọn khóa học"
                >
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>
              <div
                id="course-search-results"
                class="position-absolute w-100 bg-white border rounded shadow-lg d-none"
                style="
                  z-index: 1055;
                  max-height: 250px;
                  overflow-y: auto;
                  top: 100%;
                  margin-top: 4px;
                "
              ></div>
            </div>

            <div class="col-md-6">
              <label
                for="class-grade"
                class="form-label text-muted small fw-bold"
                >Khối học <span class="text-danger">*</span></label
              >
              <select class="form-select" id="class-grade" required>
                <option value="">-- Chọn Khối --</option>
                <option value="1">Khối 1</option>
                <option value="2">Khối 2</option>
                <option value="3">Khối 3</option>
                <option value="4">Khối 4</option>
                <option value="5">Khối 5</option>
                <option value="6">Khối 6</option>
                <option value="7">Khối 7</option>
                <option value="8">Khối 8</option>
                <option value="9">Khối 9</option>
                <option value="10">Khối 10</option>
                <option value="11">Khối 11</option>
                <option value="12">Khối 12</option>
              </select>
            </div>
            <div class="col-md-6">
              <label
                for="academic-year"
                class="form-label text-muted small fw-bold"
                >Năm học <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="academic-year"
                placeholder="VD: 2025-2026"
                required
              />
            </div>
            <div class="col-md-6">
              <label
                for="max-students"
                class="form-label text-muted small fw-bold"
                >Sĩ số tối đa <span class="text-danger">*</span></label
              >
              <div class="input-group">
                <span class="input-group-text"
                  ><i class="fa-solid fa-users text-muted"></i
                ></span>
                <input
                  type="number"
                  class="form-control"
                  id="max-students"
                  placeholder="VD: 30"
                  min="1"
                  required
                />
              </div>
            </div>
            <div class="col-12">
              <label
                for="class-description"
                class="form-label text-muted small fw-bold"
                >Mô tả chi tiết</label
              >
              <textarea
                class="form-control"
                id="class-description"
                rows="3"
                placeholder="Nhập mô tả về lớp học..."
              ></textarea>
            </div>

            <div class="col-12 d-none" id="class-status-container">
              <label
                for="class-status"
                class="form-label text-muted small fw-bold"
                >Trạng thái lớp</label
              >
              <select class="form-select" id="class-status">
                <option value="open">Đang mở (Sẵn sàng xếp lớp)</option>
                <option value="closed">Đã đóng (Dừng tuyển sinh)</option>
                <option value="pending">Đang chờ</option>
              </select>
            </div>
          </div>
        </section>

        <footer class="modal-footer border-top-0 px-4 pb-4">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">
            Hủy bỏ
          </button>
          <button
            type="button"
            class="btn btn-danger px-4 shadow-sm"
            id="btn-save"
            onclick="window.classManager.saveData()"
          >
            <i class="fa-solid fa-check me-1"></i> Lưu lớp học
          </button>
        </footer>
      </form>
    </article>
  </div>
</div>

<script src="/core/admin/classes.js"></script>
