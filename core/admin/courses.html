<link rel="stylesheet" href="/core/admin/courses.css" />

<main class="container-fluid py-2 animate__animated animate__fadeIn">
  <header class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 fw-bold mb-0">Quản lý Khóa học</h1>
    <div class="d-flex gap-2">
      <button
        id="btn-bulk-delete"
        class="btn btn-outline-danger shadow-sm d-none"
        onclick="window.courseManager.deleteSelected()"
      >
        <i class="fa-solid fa-trash-can me-1"></i> Xóa (<span
          id="selected-count"
          >0</span
        >)
      </button>
      <button
        class="btn btn-danger shadow-sm"
        onclick="window.courseManager.openModal()"
      >
        <i class="fa-solid fa-plus me-1"></i> Thêm Khóa Mới
      </button>
    </div>
  </header>

  <section class="card border-0 shadow-sm mb-4" aria-label="Bộ lọc và tìm kiếm">
    <div class="card-body p-3">
      <form class="row g-3" onsubmit="event.preventDefault()">
        <div class="col-md-8">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"
              ><i class="fa-solid fa-magnifying-glass text-muted"></i
            ></span>
            <input
              type="text"
              id="search-course"
              class="form-control border-start-0 ps-0"
              placeholder="Tìm kiếm theo mã khóa học, tên khóa học..."
              oninput="window.courseManager.handleSearch()"
            />
          </div>
        </div>
        <div class="col-md-4">
          <select
            id="filter-status"
            class="form-select cursor-pointer"
            onchange="window.courseManager.handleFilter()"
          >
            <option value="">Tất cả trạng thái</option>
            <option value="upcoming">Chưa bắt đầu (Sắp tới)</option>
            <option value="ongoing">Đang học</option>
            <option value="finished">Đã kết thúc</option>
            <option value="cancelled">Đã hủy</option>
          </select>
        </div>
      </form>
    </div>
  </section>

  <section
    class="card border-0 shadow-sm overflow-hidden"
    aria-label="Danh sách dữ liệu"
  >
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th class="ps-4" scope="col" style="min-width: 130px">
                <div class="d-flex align-items-center gap-2">
                  <input
                    type="checkbox"
                    id="cb-select-all"
                    class="select-checkbox m-0"
                    onchange="
                      window.courseManager.toggleSelectAll(this.checked)
                    "
                  />
                  <span>Mã Khóa</span>
                </div>
              </th>
              <th scope="col">Tên Khóa Học</th>
              <th scope="col" class="text-center">Số Buổi</th>
              <th scope="col">Ngày Bắt Đầu</th>
              <th scope="col">Học Phí</th>
              <th scope="col">Trạng Thái</th>
              <th class="text-end pe-4" scope="col">Thao Tác</th>
            </tr>
          </thead>
          <tbody id="course-table-body"></tbody>
        </table>
      </div>
      <div id="course-pagination"></div>
    </div>
  </section>
</main>

<div
  class="modal fade"
  id="courseModal"
  tabindex="-1"
  aria-hidden="true"
  role="dialog"
>
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <article class="modal-content border-0 shadow">
      <header class="modal-header bg-light border-bottom-0">
        <h2 class="modal-title h5 fw-bold" id="modal-title">
          Thêm Khóa Học Mới
        </h2>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Đóng"
        ></button>
      </header>

      <form id="course-form">
        <section class="modal-body p-4">
          <input type="hidden" id="course-id" />
          <div class="row g-3">
            <div class="col-md-4">
              <label
                for="course-code"
                class="form-label text-muted small fw-bold"
                >Mã khóa học <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="course-code"
                placeholder="VD: TOEIC650"
                required
              />
            </div>
            <div class="col-md-8">
              <label
                for="course-name"
                class="form-label text-muted small fw-bold"
                >Tên khóa học <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="course-name"
                placeholder="VD: Luyện thi TOEIC 650+"
                required
              />
            </div>

            <div class="col-md-4">
              <label
                for="total-sessions"
                class="form-label text-muted small fw-bold"
                >Tổng số buổi <span class="text-danger">*</span></label
              >
              <div class="input-group">
                <span class="input-group-text"
                  ><i class="fa-solid fa-clock text-muted"></i
                ></span>
                <input
                  type="number"
                  class="form-control"
                  id="total-sessions"
                  placeholder="VD: 30"
                  min="1"
                  required
                />
              </div>
            </div>

            <div class="col-md-4">
              <label
                for="start-date"
                class="form-label text-muted small fw-bold"
                >Ngày bắt đầu <span class="text-danger">*</span></label
              >
              <input
                type="date"
                class="form-control"
                id="start-date"
                required
              />
            </div>

            <div class="col-md-4">
              <label
                for="standard-fee"
                class="form-label text-muted small fw-bold"
                >Học phí / Buổi <span class="text-danger">*</span></label
              >
              <div class="input-group">
                <input
                  type="number"
                  class="form-control"
                  id="standard-fee"
                  placeholder="VD: 3000000"
                  min="0"
                  required
                />
                <span class="input-group-text bg-white fw-bold">VNĐ</span>
              </div>
            </div>

            <div class="col-12">
              <label
                for="course-description"
                class="form-label text-muted small fw-bold"
                >Mô tả</label
              >
              <textarea
                class="form-control"
                id="course-description"
                rows="3"
                placeholder="Nhập mô tả về nội dung, giáo trình sử dụng..."
              ></textarea>
            </div>

            <div class="col-12 d-none" id="course-status-container">
              <label
                for="course-status"
                class="form-label text-muted small fw-bold"
                >Trạng thái khóa học</label
              >
              <select class="form-select" id="course-status">
                <option value="upcoming">Chưa bắt đầu</option>
                <option value="ongoing">Đang học</option>
                <option value="finished">Đã kết thúc</option>
                <option value="cancelled">Hủy khóa học</option>
              </select>
            </div>
          </div>
        </section>

        <footer class="modal-footer border-top-0 px-4 pb-4">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">
            Hủy bỏ
          </button>
          <button
            type="button"
            class="btn btn-danger px-4 shadow-sm"
            id="btn-save"
            onclick="window.courseManager.saveData()"
          >
            <i class="fa-solid fa-check me-1"></i> Lưu khóa học
          </button>
        </footer>
      </form>
    </article>
  </div>
</div>

<script src="/core/admin/courses.js"></script>
