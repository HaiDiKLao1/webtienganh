<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tình hình học tập</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="children.css" />
  </head>
  <body class="bg-transparent">
    <main class="container-fluid py-2 animate__animated animate__fadeIn">
      <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h4 fw-bold mb-0 text-dark">Thông tin con</h1>
          <p class="text-muted small mb-0 mt-1">
            Quản lý và theo dõi tiến độ học tập của các con
          </p>
        </div>
      </header>

      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle text-center mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col" class="py-3">Mã học sinh</th>
                  <th scope="col" class="py-3">Họ và tên</th>
                  <th scope="col" class="py-3">Lớp đang học</th>
                  <th scope="col" class="py-3">Trạng thái</th>
                  <th scope="col" class="py-3 text-end pe-4">Thao tác</th>
                </tr>
              </thead>
              <tbody id="children-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div
        id="progressSection"
        class="d-none animate__animated animate__fadeInUp"
        style="animation-duration: 0.4s"
      >
        <div class="d-flex align-items-center mb-3">
          <div
            class="bg-danger rounded-1 me-2"
            style="width: 4px; height: 24px"
          ></div>
          <h4 class="fw-bold h5 mb-0 text-dark">
            Tiến độ học tập:
            <span id="progressStudentName" class="text-danger"></span>
          </h4>
        </div>

        <div class="row g-4">
          <div class="col-lg-4 col-md-5">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-body p-4 d-flex flex-column">
                <div class="calendar-header">
                  <button
                    class="btn btn-light border btn-sm text-secondary px-2"
                    id="prevMonthBtn"
                  >
                    <i class="fas fa-chevron-left"></i>
                  </button>
                  <span class="month-title" id="calendarMonthYear"
                    >Đang tải...</span
                  >
                  <button
                    class="btn btn-light border btn-sm text-secondary px-2"
                    id="nextMonthBtn"
                  >
                    <i class="fas fa-chevron-right"></i>
                  </button>
                </div>

                <div class="calendar-grid mb-2">
                  <div class="weekday">T2</div>
                  <div class="weekday">T3</div>
                  <div class="weekday">T4</div>
                  <div class="weekday">T5</div>
                  <div class="weekday">T6</div>
                  <div class="weekday">T7</div>
                  <div class="weekday sunday">CN</div>
                </div>

                <div class="calendar-grid flex-grow-1" id="calendarDays"></div>

                <div
                  class="mt-4 pt-3 border-top text-center bg-light rounded-2 py-2"
                >
                  <span class="text-muted small fw-medium"
                    >Số buổi nghỉ trong tháng:</span
                  >
                  <strong id="absenceSummary" class="text-danger fs-5 ms-1"
                    >0</strong
                  >
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-8 col-md-7">
            <div class="card border-0 shadow-sm h-100">
              <div
                class="card-body p-4 d-flex flex-column justify-content-center"
                id="classDetail"
              >
                <div class="empty-state">
                  <i class="far fa-calendar-check empty-icon"></i>
                  <h6 class="fw-bold text-dark mt-3">Chưa chọn ngày</h6>
                  <p class="small text-muted mb-0">
                    Vui lòng nhấp vào một ngày trên lịch để xem chi tiết buổi
                    học.
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="children.js"></script>
  </body>
</html>
